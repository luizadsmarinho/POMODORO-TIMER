<!-- Pomodoro Timer - Projeto de Cronômetro com Temas de Chuva e Pássaros -->
<!-- Desenvolvido por mim - Luiza Marinho -->
<!-- Este projeto é um cronômetro Pomodoro que permite configurar tempos de foco e descanso, com uma interface inspirada na natureza. Ele inclui sons relaxantes de chuva para o período de foco e sons de pássaros para o período de descanso, criando uma experiência imersiva e agradável para ajudar na concentração e relaxamento. O design é responsivo e visualmente atraente, com uma imagem de fundo de floresta e uma camada escura para destacar o conteúdo. O código é escrito em HTML, CSS e JavaScript, garantindo funcionalidade e estética -->
<!-- O Objetivo inicial era criar um cronômetro Pomodoro simples que me auxiliasse a manter o foco durante meus estudos, mas acabei me inspirando na natureza e no aplicativo mobile que estou desenvolvendo - o Yegatu, um app que ensina a falar Nheengatu, a língua indígena falada na Amazônia. Assim, incorporei os elementos de chuva e pássaros para criar uma atmosfera mais relaxante, imersiva e próxima da floresta, o que me ajuda a me sentir mais conectada à natureza mesmo quando estou estudando em casa. Como não tenho condições ainda de pagar o Youtube Premium pra ouvir músicas sem anúncios, criar um meio de incorporar sons relaxantes + Pomodoro de forma gratuita foi uma solução perfeita pra mim. -->
<!-- Plus: ele possui a mesma paleta de cores que o Yegatu, o que me deixa super feliz e orgulhosa, porque é a primeira vez que consigo criar algo com uma identidade visual tão consistente. -->


<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');</style>

<link rel="stylesheet" href="style.css">

<link rel="icon" href="favicon.png" type="image/png"> 

<title>Pomodoro Timer</title>
</head>

<body>

<div class="rain"></div>

<video id="rainVideo" autoplay muted loop>
  <source src="rain.mp4" type="video/mp4">
</video>

<video id="birdVideo" autoplay muted loop style="display:none;">
  <source src="bird.mp4" type="video/mp4">
</video>

<div class="container">
  <h1>Pomodoro Timer</h1>

  <div class="controls">
    <div>
      <label>Foco</label>
      <input type="number" id="focusTime" value="25" min="1" oninput="updateFromInput()">
    </div>

    <div>
      <label>Descanso</label>
      <input type="number" id="breakTime" value="5" min="1" oninput="updateFromInput()">
    </div>
  </div>

  <div id="status">Pronto</div>
  <div id="timer">25:00</div>

<div class="buttons">
  <button class="start" onclick="start()">Iniciar</button>
  <button class="pause" onclick="pause()">Pausar</button>
  <button class="reset" onclick="reset()">Reiniciar</button>
</div>

<div class="volume-control">
  <label for="rainVolume">🔊 Volume</label>

  <input
    type="range"
    id="rainVolume"
    min="0"
    max="100"
    value="25"
    oninput="updateRainVolume()"
  >

  <span id="rainVolumeValue">25%</span>
</div>

<audio id="rainSound" loop>
  <source src="rain.mp3">
</audio>

<audio id="birdsSound" loop>
  <source src="birds.mp3">
</audio>

<script src="script.js"></script>

</body>
</html>
